    .distortion { position: absolute; inset: 0; backdrop-filter: blur(0px); pointer-events: none; overflow: hidden; }
    .blob {
      position: absolute; width: 220px; height: 220px;
      border-radius: 42% 58% 63% 37% / 40% 45% 55% 60%;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      mix-blend-mode: screen;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: morph 5s ease-in-out infinite, pulse 2.5s ease-in-out infinite;
      box-shadow: 0 0 40px rgba(255,255,255,0.25), inset 0 0 25px rgba(255,255,255,0.15);
    }
    @keyframes morph {
      0%   { border-radius: 42% 58% 63% 37% / 40% 45% 55% 60%; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      25%  { border-radius: 60% 40% 35% 65% / 52% 70% 30% 48%; transform: translate(-50%, -50%) scale(1.1) rotate(90deg); }
      50%  { border-radius: 35% 65% 55% 45% / 62% 38% 62% 38%; transform: translate(-50%, -50%) scale(0.95) rotate(180deg); }
      75%  { border-radius: 55% 45% 70% 30% / 30% 60% 40% 70%; transform: translate(-50%, -50%) scale(1.08) rotate(270deg); }
      100% { border-radius: 42% 58% 63% 37% / 40% 45% 55% 60%; transform: translate(-50%, -50%) scale(1) rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.4); }
    }
    .title {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 3rem; letter-spacing: 0.2rem;
      text-shadow: 0 0 20px rgba(0,0,0,0.6); z-index: 2; pointer-events: none;
    }
    .glow {
      position: absolute; width: 450px; height: 450px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
      transform: translate(-50%, -50%); pointer-events: none;
      mix-blend-mode: screen; filter: blur(30px);
    }
  </style>
</head>
<body>
  <div class="distortion">
    <div class="glow"></div>
    <div class="blob"></div>
  </div>
  <div class="title">Michał Białach</div>
  <script>
    const blob = document.querySelector('.blob');
    const glow = document.querySelector('.glow');
    let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
    let currentX = mouseX, currentY = mouseY;
    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    function animate() {
      currentX += (mouseX - currentX) * 0.12;
      currentY += (mouseY - currentY) * 0.12;
      blob.style.left = currentX + 'px'; blob.style.top = currentY + 'px';
      glow.style.left = currentX + 'px'; glow.style.top = currentY + 'px';
      requestAnimationFrame(animate);
    }
    animate();
    window.addEventListener('click', () => {
      blob.animate([
        { transform: 'translate(-50%, -50%) scale(1)' },
        { transform: 'translate(-50%, -50%) scale(1.4)' },
        { transform: 'translate(-50%, -50%) scale(1)' }
      ], { duration: 500, easing: 'ease-out' });
    });
  </script>
</body>
</html>
